id: freysa-security
order: 5
name: Freysa Security
short_description: "On-chain security intelligence for autonomous AI agents"
short_description_zh: "自主 AI 代理的链上安全智能层"
full_description: |
  Freysa Security provides real-time on-chain security intelligence for autonomous AI agents operating on Base and Ethereum.
  
  27 endpoints covering: CAPTCHA solving, token honeypot detection, wallet forensics, address risk scoring, approval risk analysis, pre-trade safety checks, agent transaction preflight, smart contract code review, deep reasoning, data synthesis, web scraping, and market data (gas prices, trending tokens, Base network stats).
  
  Built for trading bots, DeFi agents, and automated security scanners. All endpoints payable via x402 protocol — no API keys, no signup, just USDC on Base.
  
  Tiered pricing: $0.00 (gas — free tier), $0.001 (data feeds), $0.01 (CAPTCHA), $0.25 (security analysis), $1.00-$2.50 (pre-flight simulation).
website: https://economic-agent-369.freysa.dev
logo_url: /providers/freysa-security.svg
category: crypto
tags: [security, on-chain, crypto, defi, trading, analysis, honeypot, forensics, risk, captcha]
featured: true

upstream_base_url: https://economic-agent-369.freysa.dev
upstream_type: none

routes:
  # ── FREE: Gas prices (loss leader) ──
  - gateway_path: /api/v1/freysa/eth-gas
    upstream_path: /api/eth-gas
    method: GET
    category: Data
    user_price: "0.00"
    description_en: "Current Ethereum gas prices from live mempool (FREE)"
    allowed_params: []

  # ── HIGHEST VOLUME: CAPTCHA Solving ──
  - gateway_path: /api/v1/freysa/captcha-solve
