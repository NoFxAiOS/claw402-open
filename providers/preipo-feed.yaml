id: preipo-feed
order: 18
name: PreIPO Feed
short_description: "On-chain pre-IPO perps vs private valuation for OpenAI and Anthropic, native x402"
short_description_zh: "OpenAI 与 Anthropic 的链上 pre-IPO 永续 vs 私募估值，原生 x402"
full_description: >
  PreIPO Feed (preipo-feed.vercel.app) sells sourced pre-IPO facts to agents over x402.
  This listing exposes one live endpoint: the OpenAI and Anthropic perpetuals on Hyperliquid
  HIP-3 (EntropyIO io:OAI, io:ANTH) converted to implied company valuation, set against the
  last private round post-money and the reported IPO valuation target, with premium/discount,
  funding, open interest and 24h volume. Every private anchor carries its source and a
  verification grade (primary / secondary / reported). Upstream is native x402 on Base USDC
  (payment is auth). Factual data only, not investment advice.
full_description_zh: >
  PreIPO Feed（preipo-feed.vercel.app）通过 x402 向 agent 出售带出处的 pre-IPO 事实数据。
  本列表只开放一个实时接口：Hyperliquid HIP-3 上的 OpenAI 与 Anthropic 永续（EntropyIO io:OAI、io:ANTH）
  换算成隐含公司估值，对比最近一轮私募投后估值和报道的 IPO 目标估值，附溢价/折价、资金费、持仓量和 24 小时成交量。
  每个私募锚点都带出处和核实等级（primary / secondary / reported）。上游为 Base USDC 原生 x402（支付即鉴权）。
  仅为事实数据，不构成投资建议。
website: https://preipo-feed.vercel.app
